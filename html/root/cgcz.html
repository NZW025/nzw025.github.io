<!DOCTYPE html>
<html lang="zh-CN">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简音乐播放器</title>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <style>
    /* 播放器容器 - 居中紧凑布局 */
    .music-player {
      max-width: 300px;
      margin: 20px auto;
      padding: 15px;
      background-color: transparent;
      text-align: center;
    }

    /* 控制按钮区域 - 核心视觉焦点 */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px; /* 按钮间距适中 */
      margin-bottom: 12px; /* 与标题分隔 */
    }

    /* 所有按钮统一基础样式 */
    .control-btn {
      background: transparent;
      border: none; /* 移除所有按钮边框 */
      color: #5a5448;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 上一首/下一首按钮 */
    .prev-btn, .next-btn {
      font-size: 18px;
      width: 28px;
      height: 28px;
    }

    /* 播放按钮（核心修改：去掉圆形边框，增大图标突出显示） */
    .play-btn {
      font-size: 18px; /* 用图标大小突出播放按钮，替代圆形边框 */
      width: 18px;
      height: 18px;
    }

    /* 按钮hover效果 - 统一交互反馈 */
    .control-btn:hover {
      color: #c89f70;
      transform: scale(1.1); /* 轻微放大增强反馈 */
    }

    /* 歌曲标题 - 简洁清晰 */
    .song-title {
      color: #5a5448;
      font-size: 15px;
      margin: 0;
      padding: 0 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
      .music-player {
        max-width: 90%;
        padding: 10px;
      }
      
      .controls {
        gap: 25px;
      }
      
      .play-btn {
        font-size: 24px;
        width: 36px;
        height: 36px;
      }
      
      .prev-btn, .next-btn {
        font-size: 20px;
      }
    }

    /* 深色模式适配 */
    @media (prefers-color-scheme: dark) {
      .song-title, .control-btn {
        color: #e8e2d5;
      }
      
      .control-btn:hover {
        color: #d4b68a;
      }
    }
  </style>
</head>

    // DOM元素
    const audio = new Audio();
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const songTitleEl = document.getElementById('current-song');

    let currentIndex = 0;
    let isPlaying = false;

    // 初始化播放器
    function initPlayer() {
      loadSong(currentIndex);
    }

    // 加载歌曲
    function loadSong(index) {
      const song = musicList[index];
      audio.src = song.url;
      songTitleEl.textContent = song.title;
    }

    // 播放/暂停切换
    function togglePlay() {
      isPlaying ? pauseSong() : playSong();
    }

    // 播放歌曲
    function playSong() {
      audio.play().catch(err => {
        console.log("播放需要用户交互，请点击按钮后重试");
      });
      isPlaying = true;
      playBtn.innerHTML = '<i class="fa fa-pause"></i>';
    }

    // 暂停歌曲
    function pauseSong() {
      audio.pause();
      isPlaying = false;
      playBtn.innerHTML = '<i class="fa fa-play"></i>';
    }

    // 上一首
    function prevSong() {
      currentIndex = (currentIndex - 1 + musicList.length) % musicList.length;
      loadSong(currentIndex);
      playSong();
    }

    // 下一首
    function nextSong() {
      currentIndex = (currentIndex + 1) % musicList.length;
      loadSong(currentIndex);
      playSong();
    }

    // 事件监听
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);
    audio.addEventListener('ended', nextSong);

    // 初始化
    initPlayer();
