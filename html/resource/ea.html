/* 链接样式 */
a {
    font-weight: bold;
    color: #5a5448;
    text-decoration: none;
    transition: all 0.3s ease;
}

a:hover {
    color: #c89f70;
    text-decoration: underline dotted;
    text-underline-offset: 0.3em;
    text-shadow: 0 0 1px #c89f70;
    transform: translateY(-2px);
}

a:active, a:visited {
    color: #5a5448;
}

h1, h2, h3, h4, h5, h6 {
    color: #5a5448;
    font-family: 'Times New Roman', serif;
    margin-top: 20px;
    margin-bottom: 15px;
}

h2 {
    font-size: 20px;
    border-bottom: 2px solid #d1c9b8;
    padding-bottom: 5px;
}

/* 容器样式 */
.mBody {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

#content {
    width: 100%;
    padding: 30px;
    margin: 40px auto;
    background-color: transparent;
}

/* 轮播图核心样式 */
.hotPic {
    position: relative;
    width: 100%;
    margin: 0 auto;
    border: 2px solid #d1c9b8;
   /*  box-shadow: -5px 5px 0px rgba(200, 159, 112, 0.2);
    transition: all 0.3s ease;
    /* 允许图片放大时溢出容器显示 */
    overflow: visible;
}

.hotPic:hover {
    box-shadow: -7px 7px 0px rgba(200, 159, 112, 0.3);
}

/* 轮播图片容器 */
.hotPic .pic {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    position: relative;
}

/* 轮播图片项 */
.hotPic .pic li {
    display: none;
    position: relative;
    width: 100%;
    margin-left: 10px auto 0px;
    padding；10px 0px;
}

/* 第一张图片默认显示 */
.hotPic .pic li:first-child {
    display: block;
}

/* 图片样式 */
.hotPic .pic li img {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    /* 移除点击放大光标 */
    cursor: default;
    transition: transform 0.3s ease;
    /* 添加transform-origin使图片从中心放大 */
    transform-origin: center;
}

/* 悬停时图片等比放大2倍 */
.hotPic .pic li img:hover {
    transform: scale(1.5);
    /* 添加z-index确保放大的图片在最上层 */
    z-index: 5;
    position: relative;
}

/* 轮播数字导航 */
.num {
    text-align: center;
    margin-bottom: 15px;
    padding-top: 10px;
}

.num span {
    display: inline-block;
    width: 30px;
    height: 30px;
    line-height: 30px;
    margin: 0 5px;
    border: 1px solid #d1c9b8;
    color: #5a5448;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.3s ease;
}

.num span:hover {
    background-color: #c89f70;
    color: #f7f3ea;
    transform: translateY(-2px);
}

.num span.cur {
    background-color: #c89f70;
    color: #f7f3ea;
    border-color: #c89f70;
}

/* 响应式适配 */
@media (max-width: 768px) {
    .hotPic {
        box-shadow: -5px 5px 0px #c89f70 !important;
        border-width: 1.5px !important;
    }
    
    .num span {
        width: 25px;
        height: 25px;
        line-height: 25px;
        margin: 0 3px;
    }
}

/* 深色模式适配 */
@media (prefers-color-scheme: dark) {
    body {
        background-color: #3a3630;
        color: #e8e2d5;
        background-image: none;
    }
    
    a, h1, h2, h3 {
        color: #e8e2d5;
    }
    
    a:hover {
        color: #d4b68a;
    }
    
    .hotPic, .num span {
        border-color: #615b52;
    }
    
    .hotPic {
        box-shadow: -5px 5px 0px rgba(212, 182, 138, 0.2);
    }
    
    .num span:hover, .num span.cur {
        background-color: #d4b68a;
        color: #3a3630;
        border-color: #d4b68a;
    }
}

    <script type="text/javascript">
    // 确保DOM加载完成后执行
    $(document).ready(function(){
        var sw = 0; // 当前显示的图片索引
        var total = $(".hotPic .pic li").length; // 图片总数
        
        // 数字导航点击事件
        $(".hotPic .num span").click(function(){
            sw = $(this).index();
            myShow(sw);
        });
        
        // 轮播显示核心函数
        function myShow(index){
            $(".hotPic .num span").eq(index).addClass("cur").siblings().removeClass("cur");
            $(".hotPic .pic li").eq(index).stop(true, true).fadeIn(600).siblings().fadeOut(600);
        }

        // 自动播放函数
        function autoPlay(){
            sw++;
            if(sw >= total) sw = 0;
            myShow(sw);
        }
        
        // 初始化自动播放（5秒切换一次）
        var myTime = setInterval(autoPlay, 5000);
        
        // 鼠标悬停轮播区域时暂停自动播放
        $(".hotPic").hover(
            function(){
                clearInterval(myTime);
            },
            function(){
                myTime = setInterval(autoPlay, 5000);
            }
        );
    });
    </script>
