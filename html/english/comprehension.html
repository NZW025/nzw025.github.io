             questionsData.sort((a,b) => a.id - b.id);

// 构建左侧原文
let originHTML = '';
questionsData.forEach((item, idx) => {
    const originId = `origin-${idx}`;
    let fullText = Array.isArray(item.originParagraphs) ? item.originParagraphs.join('\n\n') : item.originParagraphs;
    if (typeof fullText !== 'string') fullText = String(fullText);
    const loc = item.location.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${loc})`, 'g');
    const markedText = fullText.replace(regex, `<span id="${originId}" class="origin-locator">$1</span>`);
    originHTML += `
        <div class="origin-block">
            <div class="source-badge">${item.examSource}</div>
            <p>${markedText.replace(/\n\n/g, '</p><p>')}</p>
        </div>
    `;
});
document.getElementById('originColumn').innerHTML = originHTML;

// 按题型分组渲染右侧题目
const types = ['主旨大意题', '细节理解题', '词义猜测题', '推理判断题'];
let questionsHTML = '';
types.forEach(type => {
    const typeQuestions = questionsData.filter(q => q.type === type);
    if (typeQuestions.length === 0) return;
    questionsHTML += `<div class="section-title">🔍 ${type} (${typeQuestions.length}题)</div>`;
    typeQuestions.forEach(q => {
        const qid = q.id;
        const optionsList = q.options.map(opt => `<li>${opt}</li>`).join('');
        questionsHTML += `
            <div class="q-card" id="q-card-${qid}" data-qid="${qid}">
                <div class="q-header">
                    <span class="q-num" id="q-num-${qid}" data-qid="${qid}">${qid+1}</span>
                    <span class="q-type">${q.type}</span>
                </div>
                <div class="q-text" id="q-text-${qid}" data-original="${q.question.replace(/"/g, '&quot;')}">${q.question}</div>
                <ul class="options" id="options-${qid}">
                    ${optionsList}
                </ul>
            </div>
        `;
    });
    questionsHTML += `<hr>`;
});

document.getElementById('questionsColumn').innerHTML = questionsHTML;

// 交互逻辑
const totalQuestions = questionsData.length;
const clickCounts = new Array(totalQuestions).fill(0);
const originalTexts = [];
for (let i = 0; i < totalQuestions; i++) {
    originalTexts[i] = document.getElementById(`q-text-${i}`).dataset.original;
}

document.querySelectorAll('.q-num').forEach(el => {
    el.addEventListener('click', function(e) {
        e.stopPropagation();
        const qid = parseInt(this.dataset.qid);
        if (isNaN(qid)) return;
        let newCount = (clickCounts[qid] + 1) % 4;
        clickCounts[qid] = newCount;
        applyEffect(qid, newCount);
    });
});

function applyEffect(qid, count) {
    const qData = questionsData[qid];
    if (!qData) return;
    const qTextEl = document.getElementById(`q-text-${qid}`);
    const originSpan = document.getElementById(`origin-${qid}`);
    const optionsLis = document.querySelectorAll(`#options-${qid} li`);

    qTextEl.innerHTML = originalTexts[qid];
    if (originSpan) originSpan.classList.remove('underline-origin');
    optionsLis.forEach(li => li.classList.remove('correct-highlight'));

    if (count >= 1) {
        const keyword = qData.keyword;
        const text = originalTexts[qid];
        const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'i');
        qTextEl.innerHTML = text.replace(regex, `<span class="highlight-keyword">$1</span>`);
    }
    if (count >= 2) {
        if (originSpan) originSpan.classList.add('underline-origin');
    }
    if (count >= 3) {
        const answerLetter = qData.answer.toUpperCase();
        const letterMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
        const idx = letterMap[answerLetter];
        if (idx !== undefined && optionsLis[idx]) {
            optionsLis[idx].classList.add('correct-highlight');
        }
    }
}

// 重置按钮
const resetBtn = document.createElement('button');
resetBtn.className = 'reset-all-btn';
resetBtn.id = 'resetAllBtn';
resetBtn.textContent = '🔄 重置所有题目状态';
const hintDiv = document.createElement('div');
hintDiv.className = 'reset-hint';
hintDiv.appendChild(resetBtn);
document.getElementById('questionsColumn').appendChild(hintDiv);

document.getElementById('resetAllBtn').addEventListener('click', function() {
    for (let i = 0; i < totalQuestions; i++) {
        clickCounts[i] = 0;
        const qTextEl = document.getElementById(`q-text-${i}`);
        const originSpan = document.getElementById(`origin-${i}`);
        const optionsLis = document.querySelectorAll(`#options-${i} li`);
        if (qTextEl) qTextEl.innerHTML = originalTexts[i];
        if (originSpan) originSpan.classList.remove('underline-origin');
        optionsLis.forEach(li => li.classList.remove('correct-highlight'));
    }
});
})();
</script>
